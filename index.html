function pbBuild(rows,prof){var c=prof.cols,hdr=null,st=0,ci={},k;
 if(prof.header){hdr=(rows[0]||[]).map(function(x){return String(x).trim().toLowerCase()});st=1}

 var g=function(r,f){var j=ci[f];return j!=null&&j>=0&&r[j]!=null?String(r[j]).trim():""},hasC=ci.country!=null&&ci.country>=0;
 var off={},sum={rows:0,imported:0,cfp:0,bad:0,unknown:0,unk:{},expired:0,additive:0},td=pbToday();
 for(var i=st;i<rows.length;i++){var r=rows[i];if(!r||r.length<2)continue;sum.rows++;
  var pr=pbNum(g(r,"price"));if(pr>=9999){sum.cfp++;continue}if(!(pr>0&&pr<100)){sum.bad++;continue}

  var notes=g(r,"notes"),prod=(g(r,"product")||pbProduct(notes)).toUpperCase(),add=/ADDITIVE/.test(prod),fb=pbFboName(g(r,"fbo"))||"(FBO not given)",mn=pbNum(g(r,"min")),d=pbDate(g(r,"date")),key=ic+"|"+fb+"|"+prod,o=off[key];
  if(!(mn>=0))mn=0;if(!o){o=off[key]={a:ic,c:code,f:fb,p:prod,x:add,d:d,t:[],fe:pbFees(notes)}}
  var dup=o.t.filter(function(t){return t[0]===mn})[0];if(dup)dup[1]=Math.min(dup[1],pr);else o.t.push([mn,pr]);

function pbLoad(cb){pbDb(function(db){if(!db){cb&&cb();return}try{var out=[],cur=db.transaction("vendors","readonly").objectStore("vendors").openCursor();

 var e=pbOffers(l.from).concat(PB.idx[l.from]||[]).filter(function(x){return pbKey(x)===key})[0];if(!e)return;l.pb=pbSnap(e);l.price=l.pb.t[0][1];
